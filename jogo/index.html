<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta property="og:title" content="Tower Slot">
<title>Tower Slot</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='6' width='18' height='7' rx='2' fill='%23FFD166'/%3E%3Crect x='7' y='15' width='18' height='7' rx='2' fill='%23F4A261'/%3E%3Crect x='7' y='24' width='18' height='4' rx='1' fill='%23E76F51'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/enhance.css">
<style>
  :root{
    --jogo-bg:#7fc4e8;
    --jogo-bg2:#cfe9f5;
    --jogo-text:#0d1b2a;
    --jogo-accent:#e91e63;
    --jogo-accent2:#c2185b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--jogo-bg)}
  #game-container{position:fixed;inset:0;touch-action:none;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(to bottom,var(--jogo-bg),var(--jogo-bg2))}
  canvas{display:block;width:100%;height:100%}
  #hud-top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;
    text-align:center;pointer-events:none;color:var(--jogo-text)}
  #game-title{font-size:26px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
    color:#fff;text-shadow:0 2px 0 #b3541e,0 4px 12px rgba(0,0,0,.45)}
  #mult{font-size:52px;font-weight:900;line-height:1;color:#fff;
    text-shadow:0 3px 0 #b3541e,0 6px 16px rgba(0,0,0,.4);transition:transform .12s ease}
  #mult.pop{transform:scale(1.25)}
  #andares-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-top:2px}
  #floaters{position:absolute;inset:0;pointer-events:none;z-index:18;overflow:hidden}
  .floater{position:absolute;font-size:30px;font-weight:900;color:#fff;
    text-shadow:0 2px 0 #1b7a3d,0 4px 14px rgba(0,0,0,.4);
    animation:floatUp 1s ease-out forwards}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
    25%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-70px) scale(1)}
  }
  #flash{position:absolute;inset:0;pointer-events:none;z-index:17;opacity:0;
    background:radial-gradient(circle at 50% 65%,rgba(255,255,255,.85),rgba(255,255,255,0) 60%)}
  #flash.on{animation:flashIn .35s ease-out}
  @keyframes flashIn{0%{opacity:.75}100%{opacity:0}}
  #start-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;background:rgba(0,0,0,.45);color:#fff;z-index:15;text-align:center;padding:24px}
  #start-screen h1{font-size:34px;font-weight:900;letter-spacing:1px}
  #start-screen p{font-size:16px;opacity:.85;max-width:280px}
  #start-screen .arrow{font-size:44px;animation:bounce 1s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
  .hidden{display:none!important}
  #game-over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;background:rgba(0,0,0,.7);color:#fff;z-index:25;text-align:center}
  #game-over.show{display:flex}
  #game-over h2{font-size:32px;font-weight:900}
  #logo{width:min(58vw,240px);max-height:96px;object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));margin:0 auto 2px;display:block}
  #btn-som{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:20;
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:17px;
    background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="hud-top">
    <img id="logo" src="../images/tower-slot-logo.png" alt="Tower Slot"
      onerror="this.style.display='none';document.getElementById('game-title').style.display='block'">
    <div id="game-title" style="display:none">Tower Slot</div>
    <div id="mult">x1.00</div>
    <div id="andares-label"><span id="andares">0</span> acertos</div>
  </div>
  <button id="btn-som" type="button" aria-label="Ligar/desligar som">🔊</button>
  <div id="floaters"></div>
  <div id="flash"></div>
  <div id="start-screen">
    <h1>TOWER SLOT</h1>
    <p>A peça fica balançando na grua. Toque em SOLTAR para encaixar no lugar certo e multiplicar seu valor.</p>
    <span class="arrow">↓</span>
  </div>
  <div id="game-over">
    <h2>A torre caiu!</h2>
    <p>Acertos: <span id="final-andares">0</span></p>
  </div>
</div>


<script>
/* Cores vindas do painel admin (mesma API do jogo anterior) */
(function () {
  var loc = window.location;
  var parts = loc.pathname.split('/');
  var base = parts.slice(0, parts.indexOf('jogo')).join('/');
  var ts = Date.now();
  var urls = [
    loc.origin + base + '/api/public/config?_=' + ts,
    loc.origin + base + '/api/index.php/public/config?_=' + ts
  ];
  function aplicar(data) {
    var c = (data && data.cores) ? data.cores : {};
    var root = document.documentElement;
    if (c.cor_bg) root.style.setProperty('--jogo-bg', c.cor_bg);
    if (c.cor_bg2) root.style.setProperty('--jogo-bg2', c.cor_bg2);
    if (c.cor_text) root.style.setProperty('--jogo-text', c.cor_text);
    if (c.cor_pink) root.style.setProperty('--jogo-accent', c.cor_pink);
    if (c.cor_pink2) root.style.setProperty('--jogo-accent2', c.cor_pink2);
  }
  fetch(urls[0]).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(aplicar).catch(function () {
      fetch(urls[1]).then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(aplicar).catch(function () {});
    });
})();
</script>

<script>
(function () {
  'use strict';

  // ---- integração com a plataforma (window.parent.gameEvents) -------------
  function ev() {
    try { return window.parent && window.parent.gameEvents ? window.parent.gameEvents : null; }
    catch (e) { return null; }
  }
  function partidaAtiva() { var e = ev(); return !e || e.partidaAtiva !== false; }
  function avisarAndar(n) { var e = ev(); if (e && typeof e.onPlataformaPassada === 'function') { try { e._plataformasPassadas = n; e.onPlataformaPassada(n); } catch (x) {} } }
  function avisarMorte() { var e = ev(); if (e && typeof e.onMorreu === 'function') { try { e.onMorreu(); } catch (x) {} } }

  // dificuldade via querystring (?dif=facil|normal|dificil)
  var qs  = new URLSearchParams(location.search);
  var dif = (qs.get('dif') || (ev() && ev().dificuldade) || 'normal').toLowerCase();
  var DIF = {
    facil:   { speed: 0.020, amp: 0.20, inc: 0.0022, tol: 0.30 },
    normal:  { speed: 0.028, amp: 0.26, inc: 0.0032, tol: 0.35 },
    dificil: { speed: 0.038, amp: 0.32, inc: 0.0045, tol: 0.42 }
  }[dif] || null;
  if (!DIF) DIF = { speed: 0.028, amp: 0.26, inc: 0.0032, tol: 0.35 };

  // multiplicador (o valor real e calculado no painel; aqui e so visual)
  var MULT_INI = parseFloat(qs.get('mi')) > 0 ? parseFloat(qs.get('mi')) : 1;
  var MULT_INC = parseFloat(qs.get('mc')) > 0 ? parseFloat(qs.get('mc')) : 0.2;
  var MULT_MAX = parseFloat(qs.get('mx')) > 0 ? parseFloat(qs.get('mx')) : 0;
  function multDe(n) {
    var m = MULT_INI + n * MULT_INC;
    if (MULT_MAX > 0) m = Math.min(m, MULT_MAX);
    return m;
  }
  var multEl = document.getElementById('mult');
  function setMult(m) {
    multEl.textContent = 'x' + Number(m).toFixed(2);
    multEl.classList.add('pop');
    setTimeout(function () { multEl.classList.remove('pop'); }, 140);
  }

  // ---- efeitos ------------------------------------------------------------
  var floaters = document.getElementById('floaters');
  var flashEl  = document.getElementById('flash');

  function floater(texto, x, y) {
    var el = document.createElement('div');
    el.className = 'floater';
    el.textContent = texto;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    floaters.appendChild(el);
    setTimeout(function () { el.remove(); }, 1000);
  }
  function flash() {
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
  }
  function vibrar(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---- som (sintetizado, sem arquivos externos) ---------------------------
  var AC = null, mudo = false;
  try { mudo = localStorage.getItem('ts_mudo') === '1'; } catch (e) {}
  var btnSom = document.getElementById('btn-som');
  function pintarBtnSom() { if (btnSom) btnSom.textContent = mudo ? '🔇' : '🔊'; }
  pintarBtnSom();
  function ac() {
    if (mudo) return null;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      return AC;
    } catch (e) { return null; }
  }
  if (btnSom) btnSom.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
    mudo = !mudo;
    try { localStorage.setItem('ts_mudo', mudo ? '1' : '0'); } catch (x) {}
    pintarBtnSom();
    if (!mudo) tocarClick();
  });

  function tom(freq, dur, tipo, vol, slideTo) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = tipo || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  function ruido(dur, vol, corte) {
    var c = ac(); if (!c) return;
    var len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = corte || 900;
    var g = c.createGain(); g.gain.value = vol || 0.35;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  }
  // "tunk" grave de bloco caindo sobre o outro (madeira/pedra)
  function tocarEncaixe(n) {
    tom(150 + Math.min(10, n || 0) * 14, 0.16, 'triangle', 0.32, 70);
    tom(78, 0.22, 'sine', 0.28, 50);
    ruido(0.14, 0.30, 1400);
    setTimeout(function () { tom(660 + Math.min(12, n || 0) * 55, 0.11, 'square', 0.10); }, 60);
  }
  function tocarSoltar() { tom(430, 0.08, 'square', 0.10, 300); }
  function tocarClick()  { tom(880, 0.06, 'square', 0.08); }
  function tocarQueda() {
    ruido(0.7, 0.42, 700);
    tom(200, 0.6, 'sawtooth', 0.24, 55);
    setTimeout(function () { ruido(0.4, 0.25, 500); }, 140);
  }


  // partículas: fumaça + faíscas
  var particles = [];
  function fumaca(x, y, w) {
    for (var i = 0; i < 16; i++) {
      var side = i % 2 === 0 ? -1 : 1;
      particles.push({
        t: 'smoke',
        x: x + (i < 8 ? 0 : w) + (Math.random() - .5) * 14,
        y: y + (Math.random() - .5) * 6,
        vx: side * (0.7 + Math.random() * 1.9),
        vy: -(0.2 + Math.random() * 0.9),
        r: 6 + Math.random() * 12,
        life: 1
      });
    }
  }
  function faiscas(x, y) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2;
      particles.push({
        t: 'spark', x: x, y: y,
        vx: Math.cos(a) * (1.6 + Math.random() * 3.4),
        vy: Math.sin(a) * (1.6 + Math.random() * 3.4) - 1,
        r: 1.6 + Math.random() * 2.4, life: 1
      });
    }
  }
  function drawParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.t === 'smoke') { p.vy -= 0.02; p.vx *= 0.97; p.r += 0.5; p.life -= 0.028; }
      else { p.vy += 0.16; p.vx *= 0.98; p.life -= 0.035; }
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath();
      if (p.t === 'smoke') ctx.fillStyle = 'rgba(232,226,214,' + (p.life * 0.55).toFixed(3) + ')';
      else ctx.fillStyle = 'rgba(255,214,102,' + p.life.toFixed(3) + ')';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- canvas ------------------------------------------------------------
  var canvas = document.getElementById('canvas');
  var ctx    = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    BLOCK_H = Math.max(34, Math.min(56, Math.round(H * 0.085)));
    BASE_Y  = H - Math.round(H * 0.22);
    if (!S.stack.length) resetTorre();
  }

  var BLOCK_H = 46, BASE_Y = 400;

  var S = {
    stack: [], swingT: 0, speed: DIF.speed, ampF: DIF.amp,
    dropping: null, camera: 0, playing: false, over: false, andares: 0,
    shake: 0, glow: 0
  };

  function resetTorre() {
    var bw = Math.min(150, Math.max(90, W * 0.34));
    S.stack = [{ x: (W - bw) / 2, w: bw }];
  }

  function iniciar() {
    resetTorre();
    S.swingT = 0; S.speed = DIF.speed; S.ampF = DIF.amp;
    S.dropping = null; S.camera = 0; S.andares = 0; S.shake = 0; S.glow = 0;
    particles.length = 0;
    S.playing = true; S.over = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over').classList.remove('show');
    document.getElementById('andares').textContent = '0';
    setMult(multDe(0));
  }

  function soltar() {
    if (!S.playing || S.dropping) return;
    var top = S.stack[S.stack.length - 1];
    var amp = W * S.ampF;
    var swingX = W / 2 + Math.sin(S.swingT) * amp;
    S.dropping = { x: swingX - top.w / 2, w: top.w, y: -BLOCK_H, vy: 0 };
    vibrar(12);
    tocarSoltar();
  }

  function perder() {
    S.playing = false; S.over = true; S.shake = 18;
    fumaca(S.stack[S.stack.length - 1].x, BASE_Y - BLOCK_H + S.camera, S.stack[S.stack.length - 1].w);
    vibrar([30, 40, 60]);
    tocarQueda();
    document.getElementById('final-andares').textContent = S.andares;
    document.getElementById('game-over').classList.add('show');
    avisarMorte();
  }

  function acao() {
    if (!partidaAtiva() && !S.playing) return;
    if (S.over) return;
    if (!S.playing) iniciar(); else soltar();
  }

  // comandos vindos do painel (botao SOLTAR / parar)
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.tipo === 'soltar') acao();
    else if (d.tipo === 'pausar') { S.playing = false; }
    else if (d.tipo === 'mult' && d.valor) setMult(d.valor);
  });

  // ---- desenho -----------------------------------------------------------
  function drawBlock(x, y, w, glow) {
    var h = BLOCK_H - 4;
    if (glow) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,209,102,' + glow.toFixed(2) + ')';
      ctx.shadowBlur = 26;
    }
    ctx.fillStyle = '#a9702f'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#c98c46'; ctx.fillRect(x + 3, y + 3, w - 6, h - 8);
    ctx.fillStyle = '#6f471c'; ctx.fillRect(x + w / 2 - 9, y + 10, 18, h - 16);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 3, y + 3, w - 6, 4);
    if (glow) ctx.restore();
  }

  function frame() {
    if (S.playing && !S.dropping) S.swingT += S.speed;

    if (S.dropping) {
      S.dropping.vy += Math.max(0.9, H * 0.0022);
      S.dropping.y  += S.dropping.vy;
      var landY = BASE_Y - (S.stack.length + 1) * BLOCK_H + S.camera;
      if (S.dropping.y >= landY) {
        var top = S.stack[S.stack.length - 1];
        var d   = S.dropping;
        var left  = Math.max(d.x, top.x);
        var right = Math.min(d.x + d.w, top.x + top.w);
        var overlap = right - left;
        S.dropping = null;
        fumaca(d.x, landY + BLOCK_H - 6, d.w);
        S.shake = 8;
        if (overlap < d.w * DIF.tol) {
          perder();
        } else {
          S.stack.push({ x: left, w: overlap });
          S.speed = Math.min(0.095, S.speed + DIF.inc);
          S.ampF  = Math.min(0.40, S.ampF + 0.012);
          S.andares = S.stack.length - 1;
          S.glow = 1;
          document.getElementById('andares').textContent = S.andares;
          var m = multDe(S.andares);
          setMult(m);
          faiscas(left + overlap / 2, landY);
          flash();
          floater('x' + m.toFixed(2), left + overlap / 2, landY - 20);
          vibrar(25);
          tocarEncaixe(S.andares);
          avisarAndar(S.andares);
        }
      }
    }

    if (S.glow > 0) { S.glow -= 0.03; if (S.glow < 0) S.glow = 0; }

    var targetCam = Math.max(0, (S.stack.length - 4) * BLOCK_H);
    S.camera += (targetCam - S.camera) * 0.12;

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (S.shake > 0) { ctx.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake); S.shake *= 0.88; if (S.shake < .4) S.shake = 0; }

    // chão
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(-20, BASE_Y, W + 40, H - BASE_Y + 20);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--jogo-accent') || '#e91e63';
    ctx.fillRect(-20, BASE_Y - 5, W + 40, 5);

    for (var i = 0; i < S.stack.length; i++) {
      var y = BASE_Y - (i + 1) * BLOCK_H + S.camera;
      if (y > H || y < -BLOCK_H) continue;
      var isTopo = i === S.stack.length - 1;
      drawBlock(S.stack[i].x, y, S.stack[i].w, isTopo && S.glow > 0 ? S.glow : 0);
    }

    if (S.playing && !S.dropping) {
      var t   = S.stack[S.stack.length - 1];
      var amp = W * S.ampF;
      var sx  = W / 2 + Math.sin(S.swingT) * amp;
      var topY = Math.max(24, H * 0.22);
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, topY); ctx.stroke();
      // guia de encaixe
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.setLineDash([6, 8]); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(t.x + t.w / 2, topY + BLOCK_H);
      ctx.lineTo(t.x + t.w / 2, BASE_Y - S.stack.length * BLOCK_H + S.camera);
      ctx.stroke();
      ctx.setLineDash([]);
      drawBlock(sx - t.w / 2, topY, t.w, 0);
    }

    if (S.dropping) drawBlock(S.dropping.x, S.dropping.y, S.dropping.w, 0);
    drawParticles();
    ctx.restore();

    requestAnimationFrame(frame);
  }

  // ---- controles ---------------------------------------------------------
  document.getElementById('game-container').addEventListener('pointerdown', function () { acao(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); acao(); }
  });
  window.addEventListener('resize', resize);

  resize();
  setMult(multDe(0));
  requestAnimationFrame(frame);
})();
</script>
